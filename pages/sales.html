<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seles</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/sales.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../style/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">
            <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>

    <div id="navbar"></div>
    <div class="d-flex">
        <div id="sidebar-container"></div>
        <div class="content">
            <h1>Sales Management</h1>
            <div class="first">
                <h1>بسم الله الرحمن الرحيم</h1>
                <h1>Wellcome to Seles Pages</h1>        
            </div>

            <form id="saleForm">

                <label for="">Product : </label>
                <select id="product">
                    <option value="">Select Product</option>
                </select>
                <br>
                <label for="">Stock : </label>
                <input id="stock" class="form-control" readonly>
                <br>
                <label for="">Price/Unit : </label>
                <input id="price" type="number" class="form-control" >
                <br>
                <label for="">Quantity(dz) : </label>
                <input id="quantity" type="number" class="form-control">
                <br>
                <label for="">Total Price : </label>
                <input id="total" class="form-control" readonly>
                <br>
                <label for="">Payement Way : </label>
                <select id="paymentMethod">
                    <option value="">Select Payment</option>
                    <option>Cash</option>
                    <option>Bank</option>
                    <option>Mobile Money</option>
                    <option>Loan</option>
                </select>
                <br>

                <button type="submit">Record Sale</button>

            </form>

            <h2>Sales Recorder Table</h2>
            <div class="tableEdit">
                <table id="salesTable" class="table m-3">
                        <thead class="table-primary">
                            <tr>
                                <th>ID</th>
                                <th>Item</th>
                                <th>Qty</th>
                                <th>Price/unit</th>
                                <th>Total-Price</th>
                                <th>Payement-Methode</th>
                                <th>Date</th>

                            </tr>
                        </thead>
                <tbody>

                </tbody>
                </table>        
            </div>

            <div class="row mt-4">

                <div class="col-lg-6 mb-4">
                    <div class="card shadow-sm">
                        <div class="card-header">
                            <h5>📈 Monthly Revenue</h5>
                        </div>
                        <div class="card-body chart-container">
                            <canvas id="revenueChart"></canvas>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6 mb-4">
                    <div class="card shadow-sm">
                        <div class="card-header">
                            <h5>🥧 Payment Methods</h5>
                        </div>
                        <div class="card-body chart-container">
                            <canvas id="paymentChart"></canvas>
                        </div>
                    </div>
                </div>

            </div>

            <div class="row">

                <div class="col-lg-12">
                    <div class="card shadow-sm">
                        <div class="card-header">
                            <h5>🏆 Top Selling Products</h5>
                        </div>
                        <div class="card-body chart-container">
                            <canvas id="productChart"></canvas>
                        </div>
                    </div>
                </div>

            </div>

            <div  class="filter">
                    <h1>Data Filter</h1>
                    <h3>Choose the Date You Want to get the report</h3>
                    <label for="">From : </label>
                    <input type="date" id="fromDate">
                    <label for="">To : </label>
                    <input type="date" id="toDate">

                    <button id="filterBtn">Filter info</button>

                    <button id="resetBtn">Reset</button>
                    <br>
                    <label for="">Total Sales :</label>
                    <h2 id="todaySales">0</h2>
                    <br>
                    <label for="">Total Revenue :</label>
                    <h2 id="todayRevenue">ETB 0.00</h2>
                    <br>
                    <label for="">Total Product Sold :</label>
                    <h2 id="productsSold">0</h2>
                    <br>
                    <label for="">Total Profit :</label>
                    <h2 id="totalProfit">ETB 0.00</h2>    
            </div>

        </div>
    </div>


        <!-- Bootstrap JS -->

     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
     <script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>
     <script src="../asset/script.js"></script>

    <script src="../asset/layout.js"></script>

    <script src="../asset/sales.js"></script>


</body>
</html>
