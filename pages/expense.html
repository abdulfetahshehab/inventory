<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../style/bootstrap.min.css">
    <link rel="stylesheet" href="../style/expense.css">
</head>
<body>

    
    <div id="navbar"></div>
    <div class="d-flex">
        <div id="sidebar-container"></div>
            <div class="content">
                <h1>Expense Management</h1>
                <div class="first">
                    <h1>بسم الله الرحمن الرحيم</h1>
                    <h1>Wellcome to Expense Pages</h1>        
                </div> 
                <!-- ===========================
                    EXPENSE MANAGEMENT
            =========================== -->
                <div class="container-fluid mt-4">
                    <!-- Page Title -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h3 class="fw-bold"><i class="bi bi-cash-stack text-danger"></i>Expense Management</h3>
                    </div>
                    <div class="row">
                        <!-- ===========================
                                Expense Form
                        ============================ -->
                        <div class="col-lg-4 mb-4">
                            <div class="card shadow border-0 rounded-4">
                                <div class="card-header bg-danger text-white">
                                    <h5 class="mb-0"><i class="bi bi-wallet2"></i>Add Expense</h5>
                                </div>
                                <div class="card-body">
                                    <!-- Expense Detail -->
                                    <div class="mb-3">
                                        <h3 >Expense Detail Information</h3>
                                    </div>
                                    <!-- Expense Reason -->
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Expense Reason *</label>
                                        <select id="expenseReason" class="form-select">
                                            <option value="">Choose Reason *</option>
                                            <option>Office Rent</option>
                                            <option>Food & Dining</option>
                                            <option>Transportation</option>
                                            <option>Accommodation</option>
                                            <option>Salary</option>
                                            <option>Penalty</option>
                                            <option>Revenue</option>
                                        </select>
                                    </div>
                                    <!-- Amount -->
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Amount *</label>
                                        <input type="number" id="expenseAmount" class="form-control" placeholder="Enter Amount">
                                    </div>
                                    <!-- Vendor -->
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Vendor *</label>
                                        <input type="text" id="expenseVendor" class="form-control" placeholder="Vendor Name">
                                    </div>
                                    <!-- Date -->
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold"> Expense Date *
                                        </label>
                                        <input type="date" id="expenseDate" class="form-control">
                                    </div>
                                    <!-- Payment Method -->
                                    <div class="mb-4">
                                        <label class="form-label fw-semibold">Payment Method</label>
                                        <select id="paymentMethod" class="form-select">
                                            <option value="">Choose Payment</option>
                                            <option>Cash</option>
                                            <option>Transfer</option>
                                        </select>
                                    </div>
                                    <!-- Buttons -->
                                    <div class="d-grid gap-2">
                                        <button class="btn btn-danger" id="addExpenseBtn">
                                            <i class="bi bi-plus-circle"></i>Submit Expense
                                        </button>
                                        <button class="btn btn-secondary" id="updateExpenseBtn" style="display:none;">
                                            <i class="bi bi-pencil-square"></i>Update Expense
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- ===========================
                                Expense Table
                        ============================ -->
                        <div class="col-lg-8">
                            <div class="card shadow border-0 rounded-4">
                                <div class="card-header bg-white">
                                    <div class="row align-items-center">
                                        <div class="col-md-4">
                                            <h5 class="mb-0">Expense Records</h5>
                                        </div>
                                        <div class="col-md-4 mt-2 mt-md-0">
                                            <input type="text" id="searchExpense" class="form-control" placeholder="Search...">
                                        </div>
                                        <div class="col-md-4 text-md-end mt-2 mt-md-0">
                                            <h5 class="text-danger mb-0">Total :
                                                <span id="totalExpense">0.00</span>
                                            </h5>
                                        </div>
                                    </div>
                                </div>
                                <div class="card-body p-0">
                                    <div class="table-responsive">
                                        <table class="table table-hover table-bordered align-middle mb-0">
                                            <thead class="table-dark">
                                                <tr>
                                                    <th>#</th>
                                                    <th>Reason</th>
                                                    <th>Amount</th>
                                                    <th>Vendor</th>
                                                    <th>Date</th>
                                                    <th>Payment</th>
                                                    <th width="130">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody id="expenseTableBody">
                                                <!-- JavaScript will insert rows here -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </div>


    <script src="../asset/script.js"></script>
    <script src="../asset/layout.js"></script>
    <script src="../asset/expense.js"></script>
</body>
</html>
